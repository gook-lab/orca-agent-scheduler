<!doctype html>
<!-- The plugin page cover. Rendered to docs/cover.png at 1280×800 (README "Development"). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agent Scheduler — cover</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 44px;
        box-sizing: border-box;
        padding: 0 64px;
        color: #ecebf5;
        background:
          radial-gradient(900px 600px at 78% 20%, rgba(150, 120, 255, 0.22), transparent 70%),
          linear-gradient(135deg, #1d1a33 0%, #100f19 100%);
        font-family:
          -apple-system,
          'Helvetica Neue',
          sans-serif;
      }
      .text {
        flex: 1;
        min-width: 0;
      }
      .text img {
        width: 76px;
        height: 76px;
        display: block;
      }
      h1 {
        margin: 26px 0 0;
        font-size: 46px;
        line-height: 1.1;
        letter-spacing: -0.5px;

        margin: 16px 0 0;
        font-size: 21px;
        line-height: 1.45;
        color: #c9c5dd;

      li {
        margin-top: 12px;
        padding-left: 22px;
        position: relative;
      }
      li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 8px;
        width: 9px;
        height: 9px;
        border-radius: 50%;

      <h1>Agent Scheduler</h1>
      <p class="lead">Prompts on a schedule, for the agent terminals you already have open in Orca.</p>
      <ul>
        <li>Claude Code, Codex and Gemini CLI</li>
        <li>Waits until the terminal is idle</li>
        <li>Days, dates, every N minutes, or cron</li>
        <li>English and Korean</li>
      </ul>
    </div>
    <figure>
      <img src="panel-schedules.png" alt="" />

    <figure>
